excluded:
  - MoscowRealty.xcodeproj

identifier_name:
  min_length: 1 # `vm` (view model shorthand) and short closure params are
                # this codebase's established convention, used consistently
                # across every screen — not a mistake to flag repo-wide.

line_length:
  warning: 140
  error: 200

function_body_length:
  warning: 100
  error: 160

file_length:
  warning: 500
  error: 700
